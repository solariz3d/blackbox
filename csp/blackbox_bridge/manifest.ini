[ABOUT]
NAME = BLACKBOX Bridge
AUTHOR = solariz3d
VERSION = 0.1.0
DESCRIPTION = Mirrors CSP extended-physics scriptControllerInputs for car 0 into a named shared memory mapping (Local\AcTools.CSP.Limited.BlackboxBridge.v0) so an external telemetry logger can read values that are absent from AC's stock shared memory. Read-only with respect to the sim; modifies no car.
; Build this app was written against. ac.getPatchVersionCode() on that build: see BRIDGE_NOTES.md
REQUIRED_VERSION = 3465

[CORE]
; LAZY = 0 -> app script is loaded for the whole session rather than only while
; its window is visible. Required: the bridge must publish even with the window
; closed. Do not set this to FULL.
LAZY = 0

[WINDOW_0]
ID = main
NAME = BLACKBOX Bridge
ICON = icon.png
FUNCTION_MAIN = windowMain
SIZE = 300, 470
FLAGS = AUTO_RESIZE
