[package]
name = "blackbox"
version = "0.4.0"
description = "Assetto Corsa replay telemetry viewer"
authors = ["solariz3d"]
edition = "2021"

[lib]
name = "blackbox_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
