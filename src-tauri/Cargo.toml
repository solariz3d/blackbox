[package]
name = "blackbox"
version = "0.4.0"
description = "Assetto Corsa replay telemetry viewer"
authors = ["solariz3d"]
edition = "2021"

[lib]
name = "blackbox_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# "devtools" turns the WebView2 inspector on in a RELEASE build. Tauri gives it away free in
# debug builds, but a debug build is not usable here: the Assetto Corsa scan and the replay
# parse are Rust, and unoptimised they take long enough that the app never reaches the render
# loop being investigated. Measuring the stutter requires release speed AND the profiler, and
# this flag is the only way to have both. It is what finally attributes the 183 KB/frame of
# garbage to a function instead of to a guess — six candidates have been eliminated by test
# and every one of them was chosen by reading source.
tauri = { version = "2", features = ["protocol-asset", "devtools"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
